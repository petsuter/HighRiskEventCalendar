name: Update Filtered Calendar

on:
  schedule:
    # Runs monthly
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar

      - name: Run calendar filter script
        run: python generate_calendar.py

      - name: Commit and push updated .ics file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update filtered calendar [skip ci]"
          file_pattern: "high_risk_events.ics"
